name: Update Citation Metrics

# NOTE: the weekly schedule was removed on 2026-08-18. Google Scholar returns
# HTTP 403 to GitHub Actions runners (datacenter IPs), so every scheduled run
# failed by design rather than silently publishing lower OpenAlex numbers.
# The refresh now runs weekly from Anupom's Mac, where Scholar is reachable:
#   scripts/refresh_citations.sh, scheduled by
#   ~/Library/LaunchAgents/com.anupom.portfolio-citations.plist
# This workflow is kept for manual runs only (it will fail if Scholar blocks it).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch the deploy workflow below

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run citation update script
        run: python scripts/update_citations.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/citations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/citations.json
          git commit -m "Update citation metrics [automated]"
          git push

      # GitHub deliberately does not trigger workflows from pushes made with
      # the default GITHUB_TOKEN, to prevent recursive runs. That meant the
      # commit above never woke deploy.yml, and the live site stayed frozen on
      # the 2026-03-22 build for months while citations.json kept updating.
      # Dispatch the deploy explicitly instead.
      - name: Trigger Pages deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
